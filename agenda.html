<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agenda - Programa Pasto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- MENÚ LATERAL -->
  <button id="menu-toggle" class="menu-toggle">☰ Menú</button>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-title">Menú</div>
    <nav class="sidebar-nav"></nav>
  </aside>

  <div class="app-container">
    <header class="app-header">
      <h1>Agenda de la comuna</h1>
      <p class="app-subtitle">Reuniones ordenadas por fecha y estado.</p>
    </header>

    <!-- GUARD: si no hay sesión / permisos -->
    <section id="no-session-section" class="card" style="display:none;">
      <h2>Sesión no encontrada</h2>
      <p class="small-text">Debes iniciar sesión para ver la agenda.</p>
      <a href="index.html" class="btn-primary">Ir al inicio</a>
    </section>

    <section id="agenda-section" class="card" style="display:none;">
      <div class="comuna-header">
        <div>
          <h2 id="agenda-comuna-title">Comuna X</h2>
          <p id="agenda-user-info" class="small-text"></p>
        </div>
      </div>

      <!-- Resumen -->
      <section class="subcard">
        <h3>Resumen</h3>
        <div class="resumen-grid">
          <div class="resumen-item">
            <span class="resumen-label">Total</span>
            <span id="ag-total" class="resumen-value">0</span>
          </div>
          <div class="resumen-item">
            <span class="resumen-label">Pendientes</span>
            <span id="ag-pend" class="resumen-value">0</span>
          </div>
          <div class="resumen-item">
            <span class="resumen-label">Realizadas</span>
            <span id="ag-real" class="resumen-value">0</span>
          </div>
          <div class="resumen-item">
            <span class="resumen-label">Canceladas</span>
            <span id="ag-canc" class="resumen-value">0</span>
          </div>
        </div>
      </section>

      <!-- Filtros -->
      <section class="subcard" style="margin-top:16px;">
        <h3>Filtros</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <label class="small-text" for="ag-filter-estado">Estado</label>
          <select id="ag-filter-estado" class="input" style="max-width:220px;">
            <option value="todas">Todas</option>
            <option value="pendiente">Pendiente</option>
            <option value="realizada">Realizada</option>
            <option value="cancelada">Cancelada</option>
          </select>

          <label class="small-text" for="ag-search" style="margin-left:6px;">Buscar</label>
          <input id="ag-search" class="input" type="text" placeholder="Lugar o tipo..." style="max-width:280px;" />
        </div>
      </section>

      <!-- Lista -->
      <section class="subcard" style="margin-top:16px;">
        <h3>Reuniones</h3>
        <div id="agenda-list" style="display:flex; flex-direction:column; gap:12px;">
          <!-- tarjetas por JS -->
        </div>
      </section>
    </section>
  </div>

  <script src="assets/js/guard.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/agenda.js"></script>
</body>
</html>
