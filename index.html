<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Programa Pasto - Comunas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Estilos -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app-container">

    <!-- ENCABEZADO -->
    <header class="app-header">
      <h1>Programa Pasto - Comunas</h1>
      <p class="app-subtitle">Control de dinamizadores, líderes y bases de datos por comuna</p>
    </header>

    <!-- LOGIN -->
    <main id="login-section" class="card">
      <h2>Ingreso de Dinamizadores</h2>
      <p class="small-text">Cada dinamizador solo verá la comuna asignada.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" required placeholder="Ej: dinamizador1" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••" />
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <p id="login-error" class="error-text" style="display:none;">
        Usuario o contraseña incorrectos.
      </p>
    </main>

    <!-- VISTA PRINCIPAL DE LA COMUNA (se muestra después del login) -->
    <section id="comuna-section" class="card" style="display:none;">
      <div class="comuna-header">
        <h2 id="comuna-title">Comuna X</h2>
        <p id="dinamizador-info" class="small-text"></p>
      </div>

      <p>
        Bienvenido/a. Aquí verás la base de datos, líderes y reportes de tu comuna.
      </p>

      <button id="logout-btn" class="btn-secondary">Cerrar sesión</button>
    </section>

  </div>

  <!-- Lógica de la app -->
  <script src="assets/js/app.js"></script>
</body>
</html>
